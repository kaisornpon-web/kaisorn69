<script>
        /*========================================================================
         * 1. CONFIGURATION & STATE MANAGEMENT (การตั้งค่าและสถานะของระบบ)
         *========================================================================*/
        let CONFIG = {
            examTitle: "การทดสอบวิชาเทคโนโลยี (วิทยาการคำนวณ) ม.2",
            timeLimitMinutes: 15,
            maxWarnings: 3, 
            scriptUrl: "" 
        };

        let questionsBank = [
            {
                id: 1,
                question: "ข้อใดคือวัตถุประสงค์หลักของการใช้งานระบบความปลอดภัยบนเครือข่ายคอมพิวเตอร์?",
                choices: [
                    "ป้องกันการเข้าถึงข้อมูลโดยไม่ได้รับอนุญาต",
                    "เพิ่มความเร็วในการดาวน์โหลดข้อมูล",
                    "ประหยัดพื้นที่การเก็บข้อมูลในฮาร์ดดิสก์",
                    "ทำให้เครื่องคอมพิวเตอร์ทำงานได้เร็วขึ้น"
                ],
                correct: 0,
                explanation: "การรักษาความปลอดภัยเครือข่ายมีเป้าหมายหลักในการคุ้มครองข้อมูลจากการเข้าถึง การแก้ไข หรือการทำลายโดยไม่ได้รับอนุญาต"
            },
            {
                id: 2,
                question: "หากนักเรียนได้รับอีเมลแจ้งว่าได้รับรางวัลใหญ่ โดยให้คลิกลิงก์เพื่อกรอกรหัสผ่านบัญชีธนาคาร นักเรียนควรปฏิบัติตามข้อใด?",
                choices: [
                    "รีบกรอกข้อมูลทันทีก่อนหมดเวลา",
                    "ส่งต่ออีเมลนี้ให้เพื่อนๆ ร่วมลุ้นรางวัล",
                    "ลบอีเมลทิ้งทันทีเพราะอาจเป็น Phishing Attack",
                    "ตอบกลับอีเมลเพื่อสอบถามรายละเอียดเพิ่มเติม"
                ],
                correct: 2,
                explanation: "อีเมลล่อลวงให้กรอกข้อมูลสำคัญเรียกว่า Phishing ไม่ควรคลิกลิงก์หรือกรอกข้อมูลเด็ดขาด"
            },
            {
                id: 3,
                question: "โปรโตคอลใดที่ใช้สำหรับการรับส่งข้อมูลบนเว็บไซต์แบบปลอดภัย (มีการเข้ารหัสข้อมูล)?",
                choices: [
                    "HTTP",
                    "HTTPS",
                    "FTP",
                    "SMTP"
                ],
                correct: 1,
                explanation: "HTTPS (Hypertext Transfer Protocol Secure) จะเข้ารหัสข้อมูลระหว่างเบราว์เซอร์กับเซิร์ฟเวอร์เพื่อความปลอดภัย"
            },
            {
                id: 4,
                question: "ข้อใดเป็นรหัสผ่าน (Password) ที่มีความปลอดภัยสูงที่สุดตามหลักการสร้างรหัสผ่านที่ดี?",
                choices: [
                    "12345678",
                    "password2026",
                    "P@ssw0rd#2026!",
                    "0812345678"
                ],
                correct: 2,
                explanation: "รหัสผ่านที่ดีควรประกอบด้วย อักษรตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และอักขระพิเศษ รวมกันอย่างน้อย 8-12 ตัวอักษร"
            }
        ];

        let studentData = { fullname: "", classroom: "", studentNo: "" };
        let currentQuestionIndex = 0;
        let selectedAnswers = [];
        let warningCount = 0;
        let examTimerInterval = null;
        let totalSecondsRemaining = 0;
        let timeSpentSeconds = 0;
        let examSubmitted = false;
        let isExamActive = false;

        /*========================================================================
         * 2. INITIALIZATION & UI ROUTING
         *========================================================================*/
        window.addEventListener('DOMContentLoaded', () => {
            loadConfigFromStorage();
            updateConfigUI();
            setupAntiCheatLockdown();
        });

        function switchScreen(screenId) {
            ['screen-register', 'screen-rules', 'screen-exam', 'screen-result'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function updateConfigUI() {
            document.getElementById('nav-exam-title').innerText = CONFIG.examTitle;
            document.getElementById('info-total-questions').innerText = `${questionsBank.length} ข้อ`;
            document.getElementById('info-time-limit').innerText = `${CONFIG.timeLimitMinutes} นาที`;
            document.getElementById('info-max-warnings').innerText = `${CONFIG.maxWarnings} ครั้ง`;
            document.getElementById('rules-max-warning').innerText = CONFIG.maxWarnings;

            const badge = document.getElementById('sheet-status-badge');
            if (CONFIG.scriptUrl && CONFIG.scriptUrl.trim() !== '') {
                badge.className = "px-3 py-1 text-xs rounded-full bg-emerald-500 text-white font-semibold";
                badge.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i>เชื่อมต่อ Sheets แล้ว`;
            } else {
                badge.className = "px-3 py-1 text-xs rounded-full bg-red-500 text-white font-semibold";
                badge.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i>ยังไม่เชื่อมต่อ Sheets`;
            }
        }

        /*========================================================================
         * 3. REGISTRATION & EXAM START
         *========================================================================*/
        function handleRegister(e) {
            e.preventDefault();
            studentData.fullname = document.getElementById('input-fullname').value.trim();
            studentData.classroom = document.getElementById('input-classroom').value.trim();
            studentData.studentNo = document.getElementById('input-student-no').value.trim();

            if (!studentData.fullname || !studentData.classroom || !studentData.studentNo) {
                Swal.fire('กรอกข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลให้ครบถ้วนทุกช่อง', 'warning');
                return;
            }

            switchScreen('screen-rules');
        }

        function startExam() {
            const acceptChk = document.getElementById('chk-accept-rules');
            if (!acceptChk.checked) {
                Swal.fire('ข้อผิดพลาด', 'กรุณากดยินยอมปฏิบัติตามกฎระเบียบก่อนเริ่มสอบ', 'warning');
                return;
            }

            requestFullscreenMode();

            currentQuestionIndex = 0;
            warningCount = 0;
            selectedAnswers = new Array(questionsBank.length).fill(null);
            examSubmitted = false;
            isExamActive = true;
            totalSecondsRemaining = CONFIG.timeLimitMinutes * 60;
            timeSpentSeconds = 0;

            document.getElementById('exam-user-info').innerText = `${studentData.fullname} (${studentData.classroom} เลขที่ ${studentData.studentNo})`;
            document.getElementById('exam-warning-count').innerText = `${warningCount} / ${CONFIG.maxWarnings}`;

            switchScreen('screen-exam');
            renderQuestion();
            startTimer();
        }

        function requestFullscreenMode() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log("Fullscreen denied", err));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        /*========================================================================
         * 4. EXAM ENGINE
         *========================================================================*/
        function renderQuestion() {
            const q = questionsBank[currentQuestionIndex];
            document.getElementById('exam-progress').innerText = `ข้อที่ ${currentQuestionIndex + 1} / ${questionsBank.length}`;
            document.getElementById('exam-question-text').innerText = `${currentQuestionIndex + 1}. ${q.question}`;

            const choicesContainer = document.getElementById('exam-choices-container');
            choicesContainer.innerHTML = '';

            q.choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border-2 transition flex items-center justify-between ${
                    selectedAnswers[currentQuestionIndex] === idx 
                        ? 'border-indigo-600 bg-indigo-50 font-semibold text-indigo-900' 
                        : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'
                }`;
                btn.onclick = () => selectChoice(idx);
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-full border border-slate-300 flex items-center justify-center font-bold text-sm bg-slate-100">${String.fromCharCode(65 + idx)}</span>
                        <span>${choice}</span>
                    </div>
                    ${selectedAnswers[currentQuestionIndex] === idx ? '<i class="fa-solid fa-circle-check text-indigo-600 text-xl"></i>' : ''}
                `;
                choicesContainer.appendChild(btn);
            });

            const nextBtn = document.getElementById('btn-next-question');
            nextBtn.disabled = selectedAnswers[currentQuestionIndex] === null;
            if (currentQuestionIndex === questionsBank.length - 1) {
                nextBtn.innerHTML = `<span>ส่งข้อสอบ</span> <i class="fa-solid fa-paper-plane"></i>`;
                nextBtn.className = "bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold px-8 py-3 rounded-xl transition flex items-center space-x-2";
            } else {
                nextBtn.innerHTML = `<span>ข้อถัดไป</span> <i class="fa-solid fa-chevron-right"></i>`;
                nextBtn.className = "bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold px-8 py-3 rounded-xl transition flex items-center space-x-2";
            }
        }

        function selectChoice(index) {
            selectedAnswers[currentQuestionIndex] = index;
            renderQuestion();
        }

        function nextQuestion() {
            if (selectedAnswers[currentQuestionIndex] === null) return;

            if (currentQuestionIndex < questionsBank.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishExam("ปกติ");
            }
        }

        function startTimer() {
            clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                totalSecondsRemaining--;
                timeSpentSeconds++;

                const mins = Math.floor(totalSecondsRemaining / 60);
                const secs = totalSecondsRemaining % 60;
                document.getElementById('exam-timer').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (totalSecondsRemaining <= 0) {
                    clearInterval(examTimerInterval);
                    Swal.fire({
                        title: 'หมดเวลาทำข้อสอบ!',
                        text: 'ระบบกำลังส่งข้อสอบของคุณโดยอัตโนมัติ',
                        icon: 'info',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => finishExam("ส่งตามกำหนดเวลา (หมดเวลา)"));
                }
            }, 1000);
        }

        /*========================================================================
         * 5. ADVANCED ANTI-CHEAT CONTROL SYSTEM
         *========================================================================*/
        function setupAntiCheatLockdown() {
            document.addEventListener('contextmenu', e => e.preventDefault());

            document.addEventListener('keydown', e => {
                if (e.key === 'F12') e.preventDefault();
                if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) e.preventDefault();
                if (e.ctrlKey && e.key.toUpperCase() === 'U') e.preventDefault();
                if (e.ctrlKey && ['C', 'V', 'X', 'A'].includes(e.key.toUpperCase())) e.preventDefault();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isExamActive && !examSubmitted) {
                    handleAntiCheatViolation("สลับแท็บเบราว์เซอร์ หรือ ย่อหน้าต่างออกไปนอกระบบ");
                }
            });

            window.addEventListener('blur', () => {
                if (isExamActive && !examSubmitted) {
                    handleAntiCheatViolation("เปลี่ยนโฟกัสออกจากหน้าต่างสอบ (คลิกเปิดโปรแกรมอื่น)");
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && isExamActive && !examSubmitted) {
                    handleAntiCheatViolation("ยกเลิกโหมดเต็มหน้าจอ (Exit Fullscreen)");
                }
            });
        }

        function handleAntiCheatViolation(reason) {
            if (!isExamActive || examSubmitted) return;

            warningCount++;
            document.getElementById('exam-warning-count').innerText = `${warningCount} / ${CONFIG.maxWarnings}`;

            if (warningCount >= CONFIG.maxWarnings) {
                isExamActive = false;
                Swal.fire({
                    icon: 'error',
                    title: 'ถูกปรับฟาวล์! (Auto-Submit)',
                    html: `<b>ท่านละเมิดกฎการสอบสลับหน้าจอครบ ${CONFIG.maxWarnings} ครั้ง</b><br>สาเหตุ: ${reason}<br><br><span class="text-red-600 font-bold">ระบบได้ทำการปรับส่งข้อสอบทันที และบันทึกสถานะ "ทุจริต" ลงในระบบ</span>`,
                    confirmButtonText: 'รับทราบ',
                    allowOutsideClick: false,
                    allowEscapeKey: false
                }).then(() => {
                    finishExam("ทุจริต (สลับหน้าจอเกินกำหนด)");
                });
            } else {
                let warningText = `ท่านทำการสลับหน้าจอหรือย่อหน้าต่าง (${reason})<br><br><b>เตือนครั้งที่ ${warningCount} / ${CONFIG.maxWarnings}</b>`;
                if (warningCount === CONFIG.maxWarnings - 1) {
                    warningText += `<br><span class="text-red-600 font-bold">⚠️ หากสลับหน้าจออีก 1 ครั้ง ระบบจะปรับส่งข้อสอบทันที!</span>`;
                }

                Swal.fire({
                    icon: 'warning',
                    title: '⚠️ ตรวจพบการสลับหน้าจอ!',
                    html: warningText,
                    confirmButtonText: 'ตกลง ข้าพเจ้าจะกลับเข้าสู่การสอบ',
                    allowOutsideClick: false,
                    allowEscapeKey: false
                }).then(() => {
                    requestFullscreenMode();
                });
            }
        }

        /*========================================================================
         * 6. RESULTS & GOOGLE SHEETS SUBMISSION
         *========================================================================*/
        async function finishExam(statusString) {
            if (examSubmitted) return;
            examSubmitted = true;
            isExamActive = false;
            clearInterval(examTimerInterval);

            if (document.fullscreenElement) {
                document.exitFullscreen().catch(e => console.log(e));
            }

            let score = 0;
            questionsBank.forEach((q, idx) => {
                if (selectedAnswers[idx] === q.correct) {
                    score++;
                }
            });

            const totalQuestions = questionsBank.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            const timeSpentMins = Math.ceil(timeSpentSeconds / 60);

            switchScreen('screen-result');

            document.getElementById('res-score').innerText = `${score} / ${totalQuestions}`;
            document.getElementById('res-percentage').innerText = `${percentage}%`;
            document.getElementById('res-time-spent').innerText = `${timeSpentMins} นาที`;
            
            const resStatusElem = document.getElementById('res-status');
            const iconContainer = document.getElementById('result-icon-container');

            if (statusString.includes("ทุจริต")) {
                resStatusElem.innerText = statusString;
                resStatusElem.className = "text-sm font-bold text-red-600";
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl bg-red-100 text-red-600";
                iconContainer.innerHTML = `<i class="fa-solid fa-user-xmark"></i>`;
            } else {
                resStatusElem.innerText = statusString;
                resStatusElem.className = "text-sm font-bold text-emerald-600";
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl bg-emerald-100 text-emerald-600";
                iconContainer.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
            }

            const payload = {
                name: studentData.fullname,
                classRoom: studentData.classroom,
                no: studentData.studentNo,
                score: score,
                totalQuestions: totalQuestions,
                percentage: percentage,
                timeSpent: `${timeSpentMins} นาที`,
                status: statusString
            };

            await sendDataToGoogleSheet(payload);
            renderAnswerReview();
        }

        async function sendDataToGoogleSheet(payload) {
            const indicator = document.getElementById('sheet-sending-indicator');
            if (!CONFIG.scriptUrl || CONFIG.scriptUrl.trim() === "") {
                indicator.className = "bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-xl mb-6 text-sm flex items-center justify-center space-x-2";
                indicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>ยังไม่ได้ตั้งค่า Google Apps Script URL (บันทึกเฉพาะในหน้าจอชั่วคราว)</span>`;
                return;
            }

            try {
                await fetch(CONFIG.scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });

                indicator.className = "bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-xl mb-6 text-sm flex items-center justify-center space-x-2";
                indicator.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>บันทึกคะแนนลงใน Google Sheets เรียบร้อยแล้ว!</span>`;
            } catch (error) {
                console.error("Sheets Error:", error);
                indicator.className = "bg-red-50 border border-red-200 text-red-800 p-4 rounded-xl mb-6 text-sm flex items-center justify-center space-x-2";
                indicator.innerHTML = `<i class="fa-solid fa-circle-xmark"></i><span>เกิดข้อผิดพลาดในการส่งข้อมูลไปยัง Google Sheets</span>`;
            }
        }

        function renderAnswerReview() {
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            questionsBank.forEach((q, idx) => {
                const userAns = selectedAnswers[idx];
                const isCorrect = userAns === q.correct;

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50/50 border-red-200'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between font-bold mb-2">
                        <span class="text-slate-800">ข้อที่ ${idx + 1}: ${q.question}</span>
                        <span class="${isCorrect ? 'text-emerald-600' : 'text-red-600'} text-sm">
                            ${isCorrect ? '<i class="fa-solid fa-check"></i> ถูกต้อง' : '<i class="fa-solid fa-xmark"></i> ตอบผิด'}
                        </span>
                    </div>
                    <p class="text-sm text-slate-600 mb-1">คำตอบของคุณ: <span class="font-semibold ${isCorrect ? 'text-emerald-700' : 'text-red-700'}">${userAns !== null ? q.choices[userAns] : 'ไม่ได้ตอบ'}</span></p>
                    <p class="text-sm text-emerald-700 mb-2 font-semibold">เฉลยที่ถูกต้อง: ${q.choices[q.correct]}</p>
                    <div class="text-xs bg-white p-2.5 rounded-lg border border-slate-200 text-slate-600">
                        <i class="fa-solid fa-lightbulb text-yellow-500 mr-1"></i><b>คำอธิบาย:</b> ${q.explanation}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleAnswerReview() {
            const panel = document.getElementById('review-panel');
            panel.classList.toggle('hidden');
        }

        function resetApp() {
            switchScreen('screen-register');
        }

        /*========================================================================
         * 7. TEACHER DASHBOARD & CONFIGURATION SYSTEM
         *========================================================================*/
        function openTeacherModal() {
            document.getElementById('cfg-script-url').value = CONFIG.scriptUrl;
            document.getElementById('cfg-exam-title').value = CONFIG.examTitle;
            document.getElementById('cfg-time-limit').value = CONFIG.timeLimitMinutes;
            document.getElementById('cfg-max-warnings').value = CONFIG.maxWarnings;

            document.getElementById('cfg-question-count').innerText = questionsBank.length;
            const qList = document.getElementById('cfg-questions-list');
            qList.innerHTML = questionsBank.map((q, i) => `
                <div class="p-2 bg-white rounded border flex justify-between items-center">
                    <span><b>${i+1}.</b> ${q.question.substring(0, 45)}...</span>
                    <span class="text-indigo-600 font-semibold">${q.choices.length} ช้อยส์</span>
                </div>
            `).join('');

            document.getElementById('modal-teacher').classList.remove('hidden');
        }

        function closeTeacherModal() {
            document.getElementById('modal-teacher').classList.add('hidden');
        }

        function saveTeacherSettings() {
            CONFIG.scriptUrl = document.getElementById('cfg-script-url').value.trim();
            CONFIG.examTitle = document.getElementById('cfg-exam-title').value.trim();
            CONFIG.timeLimitMinutes = parseInt(document.getElementById('cfg-time-limit').value) || 15;
            CONFIG.maxWarnings = parseInt(document.getElementById('cfg-max-warnings').value) || 3;

            localStorage.setItem('safe_exam_config', JSON.stringify(CONFIG));
            updateConfigUI();
            closeTeacherModal();

            Swal.fire('บันทึกเรียบร้อย', 'อัปเดตการตั้งค่าระบบสอบเรียบร้อยแล้ว', 'success');
        }

        function loadConfigFromStorage() {
            const saved = localStorage.getItem('safe_exam_config');
            if (saved) {
                try { CONFIG = { ...CONFIG, ...JSON.parse(saved) }; } catch(e){}
            }
        }

        async function testSheetConnection() {
            const url = document.getElementById('cfg-script-url').value.trim();
            if (!url) {
                Swal.fire('กรุณากรอก URL', 'โปรดใส่ Google Apps Script Web App URL ก่อนกดทดสอบ', 'warning');
                return;
            }

            Swal.fire({
                title: 'กำลังทดสอบเชื่อมต่อ...',
                text: 'กำลังส่งข้อมูลทดสอบไปยัง Google Apps Script',
                didOpen: () => Swal.showLoading()
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        name: "ระบบทดสอบการเชื่อมต่อ",
                        classRoom: "ทดสอบ",
                        no: "0",
                        score: 0,
                        totalQuestions: 0,
                        percentage: 0,
                        timeSpent: "0 นาที",
                        status: "ทดสอบเชื่อมต่อ"
                    })
                });
                Swal.fire('สำเร็จ!', 'เชื่อมต่อเรียบร้อยแล้ว (โปรดตรวจสอบตาราง Google Sheets ของคุณ)', 'success');
            } catch (err) {
                Swal.fire('ล้มเหลว', `ไม่สามารถเชื่อมต่อได้: ${err.message}`, 'error');
            }
        }
    </script>
